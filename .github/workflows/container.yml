name: Fork container
on:
  push:
    branches: [feature/marketing-automations]
    tags: ['v*-automation.*']
  workflow_dispatch:
env:
  # Created by GITHUB_TOKEN so the workflow repository owns package access.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}-automations
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: listmonk
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: automation_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U listmonk" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      AUTOMATION_TEST_DSN: postgres://listmonk:test-only@localhost:5432/automation_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/... ./models/...
      - run: go vet ./internal/... ./models/... ./cmd/...
  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.fork -t listmonk-fork:local .
      - run: bash tests/run-local.sh
  publish:
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY_IMAGE }}:automation,${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v6.3.0-automation.1
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
